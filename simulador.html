<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador - Conecta Idade</title>
    <style>
        :root {
            --cor-fundo: #F8F9FA;
            --cor-texto: #1A1A1A;
            --cor-primaria: #0056B3;
            --cor-fundo-menu: #FFFFFF;
            --cor-azul-escuro: #002B5C;
            --cor-sucesso: #28A745;
            --cor-alerta: #DC3545;
            --cor-laranja: #FD7E14;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            font-size: 20px;
            margin: 0;
            padding: 0;
        }

        .barra-navegacao {
            background-color: var(--cor-azul-escuro);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .menu-logo {
            color: white;
            font-weight: bold;
            font-size: 26px;
            text-decoration: none;
        }

        /* Estrutura de Site Real com Menu Lateral */
        .layout-portal {
            display: flex;
            min-height: calc(100vh - 66px);
            max-width: none;
            /* Coloca a sidebar colada no canto esquerdo da tela */
            margin: 0;
        }

        .menu-lateral {
            width: 320px;
            background-color: var(--cor-fundo-menu);
            border-right: 3px solid #E2E8F0;
            padding: 20px;
            box-sizing: border-box;
            flex-shrink: 0;

            /* Garante que ela fique alinhada ao topo sob a barra */
            align-self: flex-start;
        }

        .conteudo-principal {
            flex: 1;
            padding: 40px 30px;
            box-sizing: border-box;

            /* Usa toda a largura do conteúdo e centraliza o simulador dentro */
            width: 100%;
            max-width: none;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .categoria-secao {
            margin-bottom: 25px;
        }

        .categoria-titulo {
            font-size: 18px;
            font-weight: bold;
            color: var(--cor-azul-escuro);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #EDF2F7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lista-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .simulador-caixa {
            background-color: #FFFFFF;
            border: 4px solid var(--cor-primaria);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);

            /* Reforça o alinhamento horizontal */
            margin: 0 auto;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            text-decoration: none;
            color: var(--cor-texto);
            font-weight: bold;
            font-size: 18px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .menu-link:hover, .menu-link.ativo {
            background-color: #E7F1FF;
            border-color: var(--cor-primaria);
            color: var(--cor-primaria);
        }

        .instrucao {
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 20px;
            background-color: #FFF3CD;
            padding: 15px;
            border-left: 6px solid #FFC107;
            border-radius: 4px;
        }

        .tela-celular {
            width: 330px;
            height: 480px;
            background-color: #FFFFFF;
            border: 12px solid #333;
            border-radius: 35px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0;
            align-items: stretch;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .botao-grande {
            background-color: var(--cor-primaria);
            color: white !important;
            font-size: 22px;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #003D82;
            width: 90%;
        }

        .botao-grande:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #003D82;
        }

        .botao-alerta { background-color: var(--cor-alerta); box-shadow: 0 5px 0 #A71D2A; }
        .botao-sucesso { background-color: var(--cor-sucesso); box-shadow: 0 5px 0 #1E7E34; }

        .feedback {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 35px;
        }
        .sucesso { color: var(--cor-sucesso); }
        .erro { color: var(--cor-alerta); }
    </style>
</head>
<body>

    <nav class="barra-navegacao">
        <a href="index.html" class="menu-logo"> Voltar para o Início</a>
    </nav>

    <div class="layout-portal">
        <!-- Menu Lateral Reutilizado no Simulador -->
        <aside class="menu-lateral">
            <div class="categoria-secao">
                <div class="categoria-titulo">🏥 Saúde e Serviços</div>
                <div class="lista-links">
                    <a href="simulador.html?tema=inss" id="link-inss" class="menu-link"><span>👴</span> Meu INSS</a>
                    <a href="simulador.html?tema=carteira" id="link-carteira" class="menu-link"><span>🪪</span> Documentos Digitais</a>
                </div>
            </div>
            <div class="categoria-secao">
                <div class="categoria-titulo">💰 Finanças e Segurança</div>
                <div class="lista-links">
                    <a href="simulador.html?tema=pagar_conta" id="link-pagar_conta" class="menu-link"><span>🧾</span> Banco CAIXA: Contas</a>
                    <a href="simulador.html?tema=whatsapp" id="link-whatsapp" class="menu-link"><span>🛡️</span> Evitar Golpes</a>
                </div>
            </div>
            <div class="categoria-secao">
                <div class="categoria-titulo">🚗 Mobilidade</div>
                <div class="lista-links">
                    <a href="simulador.html?tema=uber" id="link-uber" class="menu-link"><span>🚖</span> Pedir Uber ou 99</a>
                    <a href="simulador.html?tema=maps" id="link-maps" class="menu-link"><span>🗺️</span> Google Maps</a>
                </div>
            </div>
            <div class="categoria-secao">
                <div class="categoria-titulo">🛒 Compras Diárias</div>
                <div class="lista-links">
                    <a href="simulador.html?tema=mercado" id="link-mercado" class="menu-link"><span>📦</span> Mercado Livre</a>
                    <a href="simulador.html?tema=youtube" id="link-youtube" class="menu-link"><span>▶️</span> YouTube</a>
                </div>
            </div>
        </aside>

        <!-- Área do Simulador Isolada -->
        <main class="conteudo-principal">
            <div class="simulador-caixa">
                <div class="instrucao" id="texto-instrucao"></div>
                <div class="tela-celular" id="tela-treino"></div>
                <div class="feedback" id="mensagem-feedback"></div>
            </div>
        </main> <!-- CORRIGIDO: Tag alterada de </div> para </main> -->
    </div>

        <script type="module">
        import { tutoriais } from './tutoriais.js';

        const urlParams = new URLSearchParams(window.location.search);
        const tutorialAtivo = urlParams.get('tema');
        let passoAtual = parseInt(urlParams.get('passo')) || 0;

        // Destaca visualmente no menu lateral qual tutorial está aberto
        if (tutorialAtivo) {
            const linkAtivo = document.getElementById(`link-${tutorialAtivo}`);
            if (linkAtivo) {
                linkAtivo.classList.add('ativo');
            }
        }

        // Criamos a função de renderizar de forma segura
        window.renderizarPasso = function() {
            // Checagem segura: se o tema não existir no arquivo tutoriais.js, avisa o usuário de forma amigável
            if (!tutorialAtivo || !tutoriais[tutorialAtivo]) {
                document.getElementById('texto-instrucao').innerHTML = 'Escolha um tutorial.';
                document.getElementById('mensagem-feedback').innerHTML = "<span class='erro'>⚠️ Selecione uma das opções no menu lateral para começar a treinar!</span>";
                return; // Para a função aqui sem quebrar o resto do site
            }

            const dados = tutoriais[tutorialAtivo][passoAtual];
            
            if (dados) {
                document.getElementById('texto-instrucao').innerHTML = dados.instrucao;
                document.getElementById('tela-treino').innerHTML = dados.conteudo;
                document.getElementById('mensagem-feedback').innerHTML = "";
            }
        }
        
        window.irParaPasso = function(numero) {
            passoAtual = numero;
            window.renderizarPasso();
        }

        window.mostrarErro = function(tipo) {
            const msg = document.getElementById('mensagem-feedback');
            msg.innerHTML = `<span class='erro'>⚠️ Cuidado! Isso pode ser perigoso ou um golpe. No mundo real, evite essa opção.</span>`;
        }

        window.avancarPasso = function() {
            if (!tutoriais[tutorialAtivo] || !tutoriais[tutorialAtivo][passoAtual]) return;

            const feedback = tutoriais[tutorialAtivo][passoAtual].feedback;
            passoAtual++;

            if(feedback) {
                let feedbackHTML = `<span class='sucesso'>${feedback}</span>`;
                
                // Se for o último passo do tutorial, adiciona o botão de finalizar
                if (passoAtual === tutoriais[tutorialAtivo].length) {
                    feedbackHTML += `
                        <div style="margin-top: 25px; display:flex; justify-content:center;">
                            <button class="botao-grande botao-sucesso" onclick="window.location.href='index.html'">Finalizar Tutorial</button>
                        </div>`;
                }
                document.getElementById('mensagem-feedback').innerHTML = feedbackHTML;
            }

            if (passoAtual < tutoriais[tutorialAtivo].length) {
                setTimeout(window.renderizarPasso, 1500); // Dá um tempo para o idoso ler o feedback
            }
        }

        // Executa o desenho da tela imediatamente após o mapeamento das funções
        window.renderizarPasso();
    </script>

</body>
</html>
