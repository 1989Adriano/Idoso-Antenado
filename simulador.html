<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador - Conecta Idade</title>
    <style>
        :root {
            --cor-fundo: #F8F9FA;
            --cor-texto: #1A1A1A;
            --cor-primaria: #0056B3;
            --cor-fundo-menu: #FFFFFF;
            --cor-azul-escuro: #002B5C;
            --cor-sucesso: #28A745;
            --cor-alerta: #DC3545;
            --cor-laranja: #FD7E14;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            font-size: 20px;
            margin: 0;
            padding: 0;
        }

        .barra-navegacao {
            background-color: var(--cor-azul-escuro);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .menu-logo {
            color: white;
            font-weight: bold;
            font-size: 26px;
            text-decoration: none;
        }

        /* Estrutura de Site Real com Menu Lateral */
        .layout-portal {
            display: flex;
            min-height: calc(100vh - 66px);
            max-width: none;
            /* Coloca a sidebar colada no canto esquerdo da tela */
            margin: 0;
        }

        .menu-lateral {
            width: 320px;
            background-color: var(--cor-fundo-menu);
            border-right: 3px solid #E2E8F0;
            padding: 20px;
            box-sizing: border-box;
            flex-shrink: 0;

            /* Garante que ela fique alinhada ao topo sob a barra */
            align-self: flex-start;
        }

        .conteudo-principal {
            flex: 1;
            padding: 40px 30px;
            box-sizing: border-box;

            /* Usa toda a largura do conteúdo e centraliza o simulador dentro */
            width: 100%;
            max-width: none;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .categoria-secao {
            margin-bottom: 25px;
        }

        .categoria-titulo {
            font-size: 18px;
            font-weight: bold;
            color: var(--cor-azul-escuro);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #EDF2F7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lista-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .simulador-caixa {
            background-color: #FFFFFF;
            border: 4px solid var(--cor-primaria);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);

            /* Reforça o alinhamento horizontal */
            margin: 0 auto;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            text-decoration: none;
            color: var(--cor-texto);
            font-weight: bold;
            font-size: 18px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .menu-link:hover, .menu-link.ativo {
            background-color: #E7F1FF;
            border-color: var(--cor-primaria);
            color: var(--cor-primaria);
        }

        .instrucao {
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 20px;
            background-color: #FFF3CD;
            padding: 15px;
            border-left: 6px solid #FFC107;
            border-radius: 4px;
        }

        .tela-celular {
            width: 330px;
            height: 480px;
            background-color: #FFFFFF;
            border: 12px solid #333;
            border-radius: 35px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0;
            align-items: stretch;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

              .botao-grande {
            background-color: var(--cor-primaria);
            color: white !important;
            font-size: 24px; /* Ligeiramente maior para leitura fácil */
            font-weight: bold;
            padding: 18px 30px;
            border: 2px solid rgba(0,0,0,0.1);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 0 #003D82, 0 8px 15px rgba(0,0,0,0.15); /* Relevo 3D nítido */
            width: 90%;
            transition: all 0.1s ease;
            display: inline-block;
        }

        .botao-grande:active {
            transform: translateY(4px); /* Faz o botão afundar de verdade ao clicar */
            box-shadow: 0 2px 0 #003D82;
        }

        .botao-alerta { background-color: var(--cor-alerta); box-shadow: 0 6px 0 #8B141F; }
        .botao-alerta:active { box-shadow: 0 2px 0 #8B141F; }

        .botao-sucesso { background-color: var(--cor-sucesso); box-shadow: 0 6px 0 #185E29; }
        .botao-sucesso:active { box-shadow: 0 2px 0 #185E29; }

        .feedback {
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
            min-height: 40px;
            line-height: 1.4;
        }
        .sucesso { color: var(--cor-sucesso); background-color: #E6F4EA; padding: 12px; border-radius: 8px; display: block; }
        .erro { color: var(--cor-alerta); background-color: #FCE8E6; padding: 12px; border-radius: 8px; display: block; }

        /* Correção para os emojis não herdarem cores estranhas de link */
        .menu-link span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>

    <nav class="barra-navegacao">
        <a href="index.html" class="menu-logo">⬅️ Voltar para o Início</a>
    </nav>

    <div class="layout-portal">
        <!-- Menu Lateral Reutilizado no Simulador -->
        <aside class="menu-lateral">
            <div class="categoria-secao">
                <div class="categoria-titulo">🏥 Saúde e Serviços</div>
                <div class="lista-links">
                    <a href="simulador.html?tema=inss" id="link-inss" class="menu-link"><span>🏛️</span> Meu INSS</a>
                    <a href="simulador.html?tema=documentos" id="link-documentos" class="menu-link"><span>🪪</span> Docs Digitais</a>
                </div>
            </div>
                        <div class="categoria-secao">
                <div class="categoria-titulo">💰 Finanças e Segurança</div>
                <div class="lista-links">
                    <a href="simulador.html?tema=pix" id="link-pix" class="menu-link"><span>💸</span> Pagar com Pix</a>
                    <!-- ALTERADO DE TEMA=WHATSAPP PARA TEMA=GOLPES -->
                    <a href="simulador.html?tema=golpes" id="link-golpes" class="menu-link"><span>🛡️</span> Evitar Golpes</a>
                </div>
            </div>
            <div class="categoria-secao">
                <div class="categoria-titulo">📱 Comunicação</div>
                <div class="lista-links">
                    <!-- BOTÃO DO WHATSAPP REAL AGORA SEPARADO -->
                    <a href="simulador.html?tema=whatsapp" id="link-whatsapp" class="menu-link"><span>💬</span> Usar WhatsApp</a>
                </div>
            </div>

            <div class="categoria-secao">
                <div class="categoria-titulo">🚗 Mobilidade</div>
                <div class="lista-links">
                    <a href="simulador.html?tema=uber" id="link-uber" class="menu-link"><span>🚖</span> Pedir Uber ou 99</a>
                    <a href="simulador.html?tema=maps" id="link-maps" class="menu-link"><span>🗺️</span> Google Maps</a>
                </div>
            </div>
            <div class="categoria-secao">
                <div class="categoria-titulo">🛒 Conteúdo e Compras</div>
                <div class="lista-links">
                    <a href="simulador.html?tema=mercado" id="link-mercado" class="menu-link"><span>📦</span> Mercado Livre</a>
                    <a href="simulador.html?tema=youtube" id="link-youtube" class="menu-link">
                        <span style="color: #FF0000 !important; font-size: 16px;">▶</span> YouTube
                    </a>
                </div>
            </div>
        </aside>

               <!-- Área do Simulador Isolada -->
        <main class="conteudo-principal">
            <div class="simulador-caixa">
                <div class="instrucao" id="texto-instrucao"></div>
                <div class="tela-celular" id="tela-treino"></div>
                <div class="feedback" id="mensagem-feedback"></div>
            </div>
        </main>
    </div>

    <!-- CARREGAMENTO DE TODOS OS COMPONENTES DO PORTAL -->
    <script src="./inss.js"></script>
    <script src="./evitar_golpes.js"></script>
    <script src="./whatsapp.js"></script>
    <script src="./carteira.js"></script>
    <script src="./pix.js"></script>
    <script src="./mercado.js"></script>
    <script src="./maps.js"></script>
    <script src="./uber.js"></script>
    <script src="./youtube.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tutorialAtivo = urlParams.get('tema');
        let passoAtual = parseInt(urlParams.get('passo')) || 0;

        // Destaca o menu lateral ativo baseado no tema real da URL
        if (tutorialAtivo) {
            const linkAtivo = document.getElementById(`link-${tutorialAtivo}`);
            if (linkAtivo) { linkAtivo.classList.add('ativo'); }
        }

        // FUNÇÃO DE RENDERIZAÇÃO ADAPTÁVEL E ORGANIZADA
        window.renderizarPasso = function() {
            const textoInstrucao = document.getElementById('texto-instrucao');
            const telaTreino = document.getElementById('tela-treino');
            const msgFeedback = document.getElementById('mensagem-feedback');

            if (!textoInstrucao || !telaTreino || !msgFeedback) return;

            if (!tutorialAtivo) {
                textoInstrucao.innerHTML = 'Escolha um tutorial.';
                msgFeedback.innerHTML = "<span class='erro'>⚠️ Selecione uma das opções no menu lateral para começar a treinar!</span>";
                return;
            }

            // MAPEAMENTO COMPLETO DE VARIÁVEIS COM SISTEMA ANTI-TRAVAMENTO
            let listaAtual = null;
            try {
                if (tutorialAtivo === 'inss' && typeof inss !== 'undefined') listaAtual = inss;
                if (tutorialAtivo === 'golpes' && typeof golpes !== 'undefined') listaAtual = golpes;
                if (tutorialAtivo === 'whatsapp' && typeof whatsapp !== 'undefined') listaAtual = whatsapp;
                if (tutorialAtivo === 'documentos' && typeof carteira !== 'undefined') listaAtual = carteira;
                if (tutorialAtivo === 'pix' && typeof pix !== 'undefined') listaAtual = pix;
                if (tutorialAtivo === 'mercado' && typeof mercado !== 'undefined') listaAtual = mercado;
                if (tutorialAtivo === 'maps' && typeof maps !== 'undefined') listaAtual = maps;
                if (tutorialAtivo === 'uber' && typeof uber !== 'undefined') listaAtual = uber;
                if (tutorialAtivo === 'youtube' && typeof youtube !== 'undefined') listaAtual = youtube;
            } catch (e) {
                console.error("Erro ao ler variáveis dos arquivos locais:", e);
            }

            // Se o idoso clicar em um botão que ainda não tem arquivo criado na pasta
            if (!listaAtual) {
                textoInstrucao.innerHTML = 'Módulo em Desenvolvimento';
                telaTreino.innerHTML = `
                    <div style="padding: 25px 15px; text-align: center; font-family: sans-serif; color: #333; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; background: #F4F7FA;">
                        <span style="font-size: 48px;">⚙️</span>
                        <p style="font-weight: bold; font-size: 16px; margin-top: 15px; color: #002B5C; margin-bottom: 5px;">Módulo Identificado!</p>
                        <p style="font-size: 13px; color: #666; line-height: 1.4; margin: 0;">
                            A tela para o tema <strong>"${tutorialAtivo}"</strong> está criada e aguarda a inclusão do arquivo <code>${tutorialAtivo}.js</code> na pasta do projeto.
                        </p>
                    </div>`;
                return;
            }

            const dados = listaAtual[passoAtual];
            if (dados) {
                textoInstrucao.innerHTML = dados.instrucao;
                telaTreino.innerHTML = dados.conteudo;
                msgFeedback.innerHTML = "";
            }
        }
        
        window.irParaPasso = function(numero) {
            passoAtual = numero;
            window.renderizarPasso();
        }

        window.mostrarErro = function(tipo) {
            const msg = document.getElementById('mensagem-feedback');
            if (msg) {
                msg.innerHTML = `<span class='erro'>⚠️ Cuidado! Isso pode ser perigoso ou um golpe. No mundo real, evite essa opção.</span>`;
            }
        }

        window.avancarPasso = function() {
            let listaAtual = null;
            try {
                if (tutorialAtivo === 'inss' && typeof inss !== 'undefined') listaAtual = inss;
                if (tutorialAtivo === 'golpes' && typeof golpes !== 'undefined') listaAtual = golpes;
                if (tutorialAtivo === 'whatsapp' && typeof whatsapp !== 'undefined') listaAtual = whatsapp;
                if (tutorialAtivo === 'documentos' && typeof carteira !== 'undefined') listaAtual = carteira;
                if (tutorialAtivo === 'pix' && typeof pix !== 'undefined') listaAtual = pix;
                if (tutorialAtivo === 'mercado' && typeof mercado !== 'undefined') listaAtual = mercado;
                if (tutorialAtivo === 'maps' && typeof maps !== 'undefined') listaAtual = maps;
                if (tutorialAtivo === 'uber' && typeof uber !== 'undefined') listaAtual = uber;
                if (tutorialAtivo === 'youtube' && typeof youtube !== 'undefined') listaAtual = youtube;
            } catch (e) {
                console.error("Erro no avanço de passos:", e);
            }

            if (!listaAtual || !listaAtual[passoAtual]) return;

            const feedback = listaAtual[passoAtual].feedback;
            passoAtual++;

            const msgFeedback = document.getElementById('mensagem-feedback');
            if (feedback && msgFeedback) {
                let feedbackHTML = `<span class='sucesso'>${feedback}</span>`;
                
                if (passoAtual === listaAtual.length) {
                    feedbackHTML += `
                        <div style="margin-top: 25px; display:flex; justify-content:center;">
                            <button class="botao-grande botao-sucesso" onclick="window.location.href='index.html'">Finalizar Tutorial</button>
                        </div>`;
                }
                msgFeedback.innerHTML = feedbackHTML;
            }

            if (passoAtual < listaAtual.length) {
                setTimeout(window.renderizarPasso, 4500); // 4.5 segundos para leitura confortável
            }
        }

        // Executa imediatamente
        window.renderizarPasso();
    </script>
</body>
</html>
