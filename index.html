<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idoso Antenado - Bem-vindo</title>

        <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* CONFIGURAÇÃO PADRÃO (FOCO INICIAL NO CELULAR) */
        .tela-abertura-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: 3fr auto auto auto 1fr;
            align-items: center;
            justify-items: center;
            text-align: center;
            padding: 30px 15px; /* Margens compactas ideais para smartphone */
            box-sizing: border-box;        
            background-color: #1E293B; /* Cor de fundo de segurança */
            background-repeat: no-repeat;
            background-position: center center;
            filter: brightness(0.90) contrast(1.15);            
           
            background-image: url('./img/fundo_principal_cel.png');         
            background-image: url('./img/fundo_principal_cel.PNG');            
            background-size: cover; 
        }

        /* INTERCEPTAÇÃO EXCLUSIVA PARA COMPUTADORES (ACIMA DE 768PX) */
        @media (min-width: 769px) {
            .tela-abertura-container {
                /* O PC, com melhor conexão, faz a troca pelo JPEG pesado */
                background-image: url('./img/fundo_principal.jpeg?v=5');
                background-size: 115% auto;   
                padding: 70px; /* Margem original expandida para monitores */
            }
        }

        /* Alinhamento dos itens nas linhas do Grid */
        .splash-emojis { grid-row: 2; }
        .splash-titulo { grid-row: 3; }
        .splash-subtitulo { grid-row: 4; }
        .btn-splash-entrada { grid-row: 5; align-self: start; }

        /* Fontes responsivas com técnicas de alto contraste */
        .splash-emojis {
            font-size: min(15vw, 100px); 
            margin-bottom: 10px; 
            animation: flutuar 3s ease-in-out infinite;
        }

        .splash-titulo {
            font-size: min(10vw, 52px); 
            color: #FFFFFF; 
            margin: 0 0 15px 0; 
            font-weight: 900;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 3px  5px 15px rgba(0, 0, 0, 0.9);
        }

        .splash-subtitulo {
            color: #FFFFFF; 
            font-size: min(4.5vw, 24px); 
            opacity: 1; 
            max-width: 600px; 
            margin: 0 0 30px 0; 
            font-weight: bold;
            line-height: 1.6;
            text-shadow: 
                -1.5px -1.5px 0 #000,  
                 1.5px -1.5px 0 #000,
                -1.5px  1.5px 0 #000,
                 1.5px  1.5px 0 #000,
                 3px  4px 12px rgba(0, 0, 0, 0.95);
        }

        .btn-splash-entrada {
            background-color: #8c470f;
            color: white;
            font-size: min(5.5vw, 26px);
            font-weight: bold;
            padding: 18px 44px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 6px 0 #653306, 0 10px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            display: inline-block;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-splash-entrada:hover {
            background-color: #e8760c;
            transform: scale(1.03); 
            box-shadow: 0 6px 0 #D96A00, 0 12px 25px rgba(253, 126, 20, 0.4); 
        }

        .btn-splash-entrada:active {
            transform: translateY(3px) scale(0.98); 
            box-shadow: 0 3px 0 #C45A00, 0 5px 10px rgba(0,0,0,0.4);
        }

        @keyframes flutuar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>


</head>

<body>
    <div class="tela-abertura-container">         
        <h1 class="splash-titulo">Idoso Antenado</h1>
        <div class="splash-emojis">👵📱👴</div>
        <p class="splash-subtitulo">
            O seu guia para aprender <br>a usar o celular e o computador<br>sem medo e com total segurança!
        </p>
        
        <button onclick="irParaMenu()" class="btn-splash-entrada">
           👵 APRENDER AGORA 👴
        </button>
    </div>

    <script>
        function irParaMenu() {
            window.location.href = "menu.html";
        }
    </script>
</body>
</html>
